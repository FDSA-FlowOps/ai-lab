name: Informe Diario del Repositorio

on:
  workflow_dispatch:

jobs:
  daily_report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      should_publish: ${{ steps.guard.outputs.should_publish }}

    steps:
      - name: Validar secreto requerido
        id: guard
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Omitiendo Informe Diario: falta OPENROUTER_API_KEY."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.should_publish == 'true'
        with:
          fetch-depth: 0

      - name: Construir contexto del repositorio
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          {
            echo "# Commits recientes"
            git log --since="24 hours ago" --oneline --decorate -n 50 || true
            echo
            echo "# Ficheros modificados en las ultimas 24h"
            git diff --name-only HEAD~20..HEAD 2>/dev/null || true
            echo
            echo "# Workflows disponibles"
            find .github/workflows -maxdepth 1 -type f | sort || true
          } > repo-context.txt

      - name: Ejecutar informe diario
        if: steps.guard.outputs.should_publish == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          responses-api-endpoint: "https://openrouter.ai/api/v1/responses"
          model: openai/gpt-5.3-codex
          effort: medium
          sandbox: workspace-write
          output-file: daily-report.md
          prompt: |
            Eres un generador de informes diarios del repositorio `${{ github.repository }}`.

            Usa el repositorio descargado y el fichero `repo-context.txt` como contexto principal.

            Tareas:
            1. Resumir la actividad mas relevante de las ultimas 24 horas.
            2. Identificar cambios importantes de codigo, workflows o documentacion.
            3. Senalar riesgos, regresiones o areas que requieren atencion.
            4. Proponer de 3 a 5 siguientes pasos concretos.

            Restricciones:
            - Se conciso pero util.
            - No inventes hechos no soportados por el contenido del repositorio.
            - Devuelve solo Markdown valido.

            Estructura obligatoria:
            # Informe Diario del Repositorio
            ## Resumen ejecutivo
            ## Cambios relevantes
            ## Riesgos o alertas
            ## Siguientes pasos

  publish_summary:
    runs-on: ubuntu-latest
    needs: daily_report
    if: needs.daily_report.outputs.should_publish == 'true' && needs.daily_report.outputs.final_message != ''
    steps:
      - name: Publicar en el resumen del job
        shell: bash
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.daily_report.outputs.final_message }}
        run: |
          {
            echo "${CODEX_FINAL_MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
