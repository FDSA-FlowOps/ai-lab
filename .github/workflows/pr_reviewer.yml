name: Revisor de Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_pull_request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      should_publish: ${{ steps.guard.outputs.should_publish }}

    steps:
      - name: Validar secreto requerido
        id: guard
        shell: bash
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Omitiendo Pull Request Reviewer: falta AZURE_OPENAI_API_KEY."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar repositorio
        if: steps.guard.outputs.should_publish == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Construir contexto de la PR
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build-pr-context.sh

      - name: Seleccionar agentes
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: node .github/scripts/select-agents.js pr-changed-files.txt .github/agent-catalog/catalog.json

      - name: Ejecutar analisis de la PR
        if: steps.guard.outputs.should_publish == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: "https://aleja-mmkilrhf-eastus2.cognitiveservices.azure.com/openai/v1/responses"
          model: gpt-5.3-codex
          effort: medium
          sandbox: workspace-write
          output-file: pr-review.md
          prompt: |
            Sigue las instrucciones de `.github/prompts/pull-request-reviewer.md`.

            Ficheros fuente de verdad:
            - `pr-context.txt`
            - `pr-changed-files.txt`
            - `selected-agents.json`
            - `selected-agents.md`

            Repositorio:
            - `${{ github.repository }}`

            Restricciones:
            - Usa solo el repositorio descargado y los ficheros generados.
            - No inventes hechos no soportados por el contenido del repositorio.
            - Si el diff fue truncado, indica claramente que el analisis es parcial.
            - Devuelve solo Markdown valido.

      - name: Extraer descripcion propuesta de la PR
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          awk '
            /^## Descripcion propuesta de la PR$/ { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' pr-review.md > pr-body-generated.md

      - name: Extraer etiquetas sugeridas
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          awk '
            /^## Etiquetas sugeridas$/ { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' pr-review.md > pr-labels-section.md

          grep '^- ' pr-labels-section.md | sed 's/^- //' > pr-labels.txt || true

      - name: Extraer comentario de revision
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          awk '
            /^## Resumen de revision$/ { capture=1 }
            /^## Recomendacion$/ && capture { print; capture=2; next }
            capture == 1 { print }
            capture == 2 { print; exit }
          ' pr-review.md > pr-review-comment.md

      - name: Subir artefactos del revisor
        if: steps.guard.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-reviewer
          path: |
            pr-context.txt
            pr-changed-files.txt
            change-metrics.json
            change-numstat.txt
            selected-agents.json
            selected-agents.md
            pr-review.md
            pr-body-generated.md
            pr-labels-section.md
            pr-labels.txt
            pr-review-comment.md

  update_pull_request_body:
    runs-on: ubuntu-latest
    needs: review_pull_request
    if: github.event_name == 'pull_request' && needs.review_pull_request.outputs.should_publish == 'true'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Descargar artefactos del revisor
        uses: actions/download-artifact@v4
        with:
          name: pull-request-reviewer

      - name: Actualizar descripcion de la PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const markerStart = '<!-- ai-pr-reviewer:start -->';
            const markerEnd = '<!-- ai-pr-reviewer:end -->';
            const generated = fs.readFileSync('pr-body-generated.md', 'utf8').trim();
            const currentBody = context.payload.pull_request.body || '';
            const managedBlock = `${markerStart}\n${generated}\n${markerEnd}`;

            let nextBody = currentBody.trim();
            if (nextBody.includes(markerStart) && nextBody.includes(markerEnd)) {
              nextBody = nextBody.replace(new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`), managedBlock);
            } else if (nextBody.length === 0) {
              nextBody = managedBlock;
            } else {
              nextBody = `${managedBlock}\n\n${nextBody}`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: nextBody
            });

      - name: Aplicar etiquetas sugeridas
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-labels.txt')) {
              return;
            }

            const labels = fs
              .readFileSync('pr-labels.txt', 'utf8')
              .split(/\r?\n/)
              .map(line => line.trim())
              .filter(Boolean);

            if (labels.length === 0) {
              return;
            }

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'BFDADC',
                  description: 'Etiqueta creada por Pull Request Reviewer'
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels
            });

      - name: Publicar comentario de revision
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-pr-reviewer-comment -->';
            const commentBody = fs.existsSync('pr-review-comment.md')
              ? fs.readFileSync('pr-review-comment.md', 'utf8').trim()
              : '';

            if (!commentBody) {
              return;
            }

            const body = `${marker}

            ## Revision automatizada de la PR

            ${commentBody}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

  publish_summary:
    runs-on: ubuntu-latest
    needs: review_pull_request
    if: needs.review_pull_request.outputs.should_publish == 'true' && needs.review_pull_request.outputs.final_message != ''
    steps:
      - name: Publicar en el resumen del job
        shell: bash
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review_pull_request.outputs.final_message }}
        run: |
          {
            echo "${CODEX_FINAL_MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
