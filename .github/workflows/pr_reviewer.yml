name: Revisor de Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_pull_request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      should_publish: ${{ steps.guard.outputs.should_publish }}

    steps:
      - name: Validar secreto requerido
        id: guard
        shell: bash
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Omitiendo Pull Request Reviewer: falta AZURE_OPENAI_API_KEY."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar repositorio
        if: steps.guard.outputs.should_publish == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Construir contexto de la PR
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build-pr-context.sh

      - name: Seleccionar agentes
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: node .github/scripts/select-agents.js pr-changed-files.txt .github/agent-catalog/catalog.json

      - name: Ejecutar analisis de la PR
        if: steps.guard.outputs.should_publish == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          responses-api-endpoint: "https://aleja-mmkilrhf-eastus2.cognitiveservices.azure.com/openai/v1/responses"
          model: gpt-5.3-codex
          effort: medium
          sandbox: workspace-write
          output-file: pr-review.md
          prompt: |
            Sigue las instrucciones de `.github/prompts/pull-request-reviewer.md`.

            Ficheros fuente de verdad:
            - `pr-context.txt`
            - `pr-changed-files.txt`
            - `selected-agents.json`
            - `selected-agents.md`

            Repositorio:
            - `${{ github.repository }}`

            Restricciones:
            - Usa solo el repositorio descargado y los ficheros generados.
            - No inventes hechos no soportados por el contenido del repositorio.
            - Si el diff fue truncado, indica claramente que el analisis es parcial.
            - Devuelve solo Markdown valido.

      - name: Extraer descripcion propuesta de la PR
        if: steps.guard.outputs.should_publish == 'true'
        shell: bash
        run: |
          awk '
            /^## Descripcion propuesta de la PR$/ { capture=1; next }
            /^## / && capture { exit }
            capture { print }
          ' pr-review.md > pr-body-generated.md

      - name: Subir artefactos del revisor
        if: steps.guard.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-reviewer
          path: |
            pr-context.txt
            pr-changed-files.txt
            change-metrics.json
            change-numstat.txt
            selected-agents.json
            selected-agents.md
            pr-review.md
            pr-body-generated.md

  update_pull_request_body:
    runs-on: ubuntu-latest
    needs: review_pull_request
    if: github.event_name == 'pull_request' && needs.review_pull_request.outputs.should_publish == 'true'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Descargar artefactos del revisor
        uses: actions/download-artifact@v4
        with:
          name: pull-request-reviewer

      - name: Actualizar descripcion de la PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const markerStart = '<!-- ai-pr-reviewer:start -->';
            const markerEnd = '<!-- ai-pr-reviewer:end -->';
            const generated = fs.readFileSync('pr-body-generated.md', 'utf8').trim();
            const currentBody = context.payload.pull_request.body || '';
            const managedBlock = `${markerStart}\n${generated}\n${markerEnd}`;

            let nextBody = currentBody.trim();
            if (nextBody.includes(markerStart) && nextBody.includes(markerEnd)) {
              nextBody = nextBody.replace(new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`), managedBlock);
            } else if (nextBody.length === 0) {
              nextBody = managedBlock;
            } else {
              nextBody = `${managedBlock}\n\n${nextBody}`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: nextBody
            });

  publish_summary:
    runs-on: ubuntu-latest
    needs: review_pull_request
    if: needs.review_pull_request.outputs.should_publish == 'true' && needs.review_pull_request.outputs.final_message != ''
    steps:
      - name: Publicar en el resumen del job
        shell: bash
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review_pull_request.outputs.final_message }}
        run: |
          {
            echo "${CODEX_FINAL_MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
