name: Test Doc Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  document:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      secrets.OPENROUTER_API_KEY != ''
    uses: FDSA-FlowOps/doc-agent/.github/workflows/document-pr.yml@0123456789abcdef0123456789abcdef01234567
    with:
      doc_mode: "pr-summary"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  document-skipped:
    if: >
      github.event.pull_request.head.repo.full_name != github.repository ||
      secrets.OPENROUTER_API_KEY == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Doc agent skipped for forked PR or missing OPENROUTER_API_KEY"