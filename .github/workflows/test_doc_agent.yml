name: Test Doc Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  document:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: FDSA-FlowOps/doc-agent/.github/workflows/document-pr.yml@9cc3866a6ea28ea443b24f593d3f35bdda6c0b40
    with:
      doc_mode: "pr-summary"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DOC_AGENT_REPO_TOKEN: ${{ secrets.DOC_AGENT_REPO_TOKEN }}